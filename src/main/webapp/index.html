<!DOCTYPE html>
<html lang=en>

<head>
	<meta charset="UTF-8">
	<meta name="theme-color" content="#0E1217">
	<link rel="icon" href="assets/upf.png">
	<title> Chirp </title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		window.App = window.App || {};
		App.Errors = App.Errors || {};
	</script>
	<script src="js/LoginValidation.js"></script>
	<script src="js/RegisterValidation.js"></script>

	<script>
		App.init = function () {

			$.ajaxSetup({ cache: false });
			// Load initial content
			$('#navigation').load("Menu");
			$('#content').load("Content");
			$('#lcolumn').load("Profile");
			$('#rcolumn').load("NotFollowed");
			// Attach global events
			App.bindEvents();

		};

		App.reloadTweets = function () {
			if ($("#feedIterator").length) {
				$("#feedIterator").load("FeedTweets");
			} else if ($("#iterator").length) {
				$("#iterator").load("Tweets");
			} else if ($("#globalFeedIterator").length) {
				$("#globalFeedIterator").load("GlobalFeedTweets");
			} else if ($("#userWallIterator").length) {
				var uid = $("#userWallId").val();
				if (uid) $("#userWallIterator").load("UserWallTweets?id=" + uid);
			}
		};

		App.bindEvents = function () {
			// Deal with menu clicks
			$(document).on("click", ".menu", function (event) {
				event.preventDefault();
				$('#content').load($(this).attr('href'));
				$('#rcolumn').load("NotFollowed");
				App.stack();
			});
			// Deal with form submission via AJAX
			$(document).on("submit", "form", function (event) {
				// solves the bug of password fields not being validated
				if (event.isDefaultPrevented() || !this.checkValidity()) {
					return;
				}
				event.preventDefault();
				const form = this;
				const data = new FormData(form);
				$.ajax({
					type: 'POST',
					enctype: 'multipart/form-data',
					url: $(form).attr('action'),
					data: data,
					processData: false,
					contentType: false
				}).done(function (html) {
					$('#navigation').load("Menu");
					$("#content").html(html);
					$('#lcolumn').load("Profile");
					$('#rcolumn').load("NotFollowed");
				});
			});
			/* Follow user */
			$(document).on("click", ".followUser", function(event) {
				$.post("Follow", {
					id : $(this).closest("[id]").attr("id")
				}, function(event) {
					$("#content").load("Followed");
					$("#rcolumn").load("NotFollowed");
				});
				event.preventDefault();
			});
			/* UnFollow user */
			$(document).on("click", ".unfollowUser", function(event) {
				$.post("Unfollow", {
					id : $(this).closest("[id]").attr("id")
				}, function(event) {
					$("#content").load("Followed");
					$("#rcolumn").load("NotFollowed");
				});
				event.preventDefault();
			});
			/* Add tweet */
			$(document).on("click", "#addTweet", function(event) {
				$.post("AddTweet", {
					content : $("#tweetContent").text()
				}, function(event) {
					$("#content").load("Timeline");
				});
				event.preventDefault();
			});
			/* Delete tweet */
			$(document).on("click", ".delTweet", function(event) {
				var tweetId = $(this).closest("[id]").attr("id");
				$.post("DelTweet", {
					id : tweetId
				}, function() {
					if ($("#feedIterator").length) {
						$("#feedIterator").load("FeedTweets");
					} else if ($("#iterator").length) {
						$("#iterator").load("Tweets");
					} else if ($("#globalFeedIterator").length) {
						$("#globalFeedIterator").load("GlobalFeedTweets");
					} else if ($("#userWallIterator").length) {
						var userWallId = $("#userWallId").val();
						$("#userWallIterator").load("UserWallTweets?id=" + userWallId);
					} else {
						$("#content").load("Timeline");
					}
				});
				event.preventDefault();
			});
			/* Ban user (admin) */
			$(document).on("click", ".banUser", function(event) {
				var userDiv = $(this).closest("[id]");
				var reason = userDiv.find(".banReason").val();
				$.post("BanUser", {
					id : userDiv.attr("id"),
					reason : reason
				}, function() {
					$("#content").load("GestioUsuaris");
				});
				event.preventDefault();
			});
			/* Unban user (admin) */
			$(document).on("click", ".unbanUser", function(event) {
				var userDiv = $(this).closest("[id]");
				$.post("UnbanUser", {
					id : userDiv.attr("id")
				}, function() {
					$("#content").load("GestioUsuaris");
				});
				event.preventDefault();
			});
			/* Like / Unlike tweet (toggle) */
			$(document).on("click", ".likeTweet", function(event) {
				var tweetDiv = $(this).closest("[id]");
				$.post("LikeTweet", {
					id : tweetDiv.attr("id")
				}, function() {
					App.reloadTweets();
				});
				event.preventDefault();
			});
			/* Comentar / Responder Tweet (Lógica Añadida) */
			$(document).on("click", ".commentTweetBtn", function(event) {
				event.preventDefault();
				var tweetDiv = $(this).closest(".w3-card");
				var parentId = tweetDiv.attr("id");
				var content = tweetDiv.find(".commentText").val();
				if (content.trim() !== "") {
					$.post("AddTweet", {
						content : content,
						parentId : parentId
					}, function() {
						App.reloadTweets();
					});
				}
			});

			/* Toggle edit profile form */
			$(document).on("click", "#editProfileBtn", function(event) {
				$("#profileViewDiv").hide();
				$("#profileEditDiv").show();
				event.preventDefault();
			});

			/* Cancel edit profile */
			$(document).on("click", "#cancelEditProfile", function(event) {
				$("#profileEditDiv").hide();
				$("#profileViewDiv").show();
				event.preventDefault();
			});

			/* Save profile edits via AJAX */
			$(document).on("submit", "#editProfileForm", function(event) {
				event.preventDefault();
				event.stopImmediatePropagation();
				
				var form = this;
				var data = {
					name: $("#editName").val(),
					nickname: $("#editNickname").val(),
					email: $("#editEmail").val(),
					favoriteGame: $("#editFavoriteGame").val()
				};
				
				$.post("UpdateProfile", data, function(response) {
					if (response.success) {
						$("#lcolumn").load("Profile");
						$("#navigation").load("Menu");
					} else {
						$(".profile-error").text(""); // Clear previous errors
						if (response.errors) {
							for (var key in response.errors) {
								$("#error-" + key).text(response.errors[key]);
							}
						}
					}
				});
			});

			/* Show edit tweet container */
			$(document).on("click", ".editTweetBtn", function(event) {
				var tweetDiv = $(this).closest(".w3-card");
				tweetDiv.find(".tweetText").hide();
				tweetDiv.find(".editTweetContainer").show();
				event.preventDefault();
			});

			/* Cancel edit tweet */
			$(document).on("click", ".cancelTweetEdit", function(event) {
				var tweetDiv = $(this).closest(".w3-card");
				tweetDiv.find(".editTweetContainer").hide();
				tweetDiv.find(".tweetText").show();
				event.preventDefault();
			});

			/* Save tweet edit via AJAX */
			$(document).on("click", ".saveTweetEdit", function(event) {
				var tweetDiv = $(this).closest(".w3-card");
				var id = tweetDiv.attr("id");
				var content = tweetDiv.find(".editTweetText").val();
				$.post("EditTweet", {
					id: id,
					content: content
				}, function() {
					if ($("#feedIterator").length) {
						$("#feedIterator").load("FeedTweets");
					} else if ($("#iterator").length) {
						$("#iterator").load("Tweets");
					} else if ($("#globalFeedIterator").length) {
						$("#globalFeedIterator").load("GlobalFeedTweets");
					} else if ($("#userWallIterator").length) {
						var userWallId = $("#userWallId").val();
						$("#userWallIterator").load("UserWallTweets?id=" + userWallId);
					}
				});
				event.preventDefault();
			});

		};

		App.stack = function () {
			$("#stack").toggleClass("w3-show");
		};

		// Ensure `App.init` runs correctly
		$(document).ready(function () {
			App.init();
		});

	</script>

</head>

<body>

	<div class="w3-theme w3-top" id="navigation"> </div>
	<div class="w3-row-padding" style="margin-top: 50px;margin-bottom: 75px">

		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="lcolumn"> </div>
		</div>
		<div class="w3-container w3-col m6">
			<div id="content"> </div>
		</div>
		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="rcolumn"> </div>
		</div>

	</div>
	<footer class="w3-container w3-theme w3-bottom">
		<p>Pompeu Fabra University @2026</p>
	</footer>

</body>

</html>
