<!DOCTYPE html>
<html lang=en>

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="assets/upf.png">
	<title> U </title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		window.App = window.App || {};
		App.Errors = App.Errors || {};
	</script>
	<script src="js/LoginValidation.js"></script>
	<script src="js/RegisterValidation.js"></script>

	<script>
		App.init = function () {

			$.ajaxSetup({ cache: false });
			// Load initial content
			$('#navigation').load("Menu");
			$('#content').load("Content");
			$('#lcolumn').load("Profile");
			$('#rcolumn').load("NotFollowed");
			// Attach global events
			App.bindEvents();

		};

		App.bindEvents = function () {
			// Deal with menu clicks
			$(document).on("click", ".menu", function (event) {
				event.preventDefault();
				$('#content').load($(this).attr('href'));
				App.stack();
			});
			// Deal with form submission via AJAX
			$(document).on("submit", "form", function (event) {
				// solves the bug of password fields not being validated
				if (event.isDefaultPrevented() || !this.checkValidity()) {
					return;
				}
				event.preventDefault();
				const form = this;
				const data = new FormData(form);
				$.ajax({
					type: 'POST',
					enctype: 'multipart/form-data',
					url: $(form).attr('action'),
					data: data,
					processData: false,
					contentType: false
				}).done(function (html) {
					$('#navigation').load("Menu");
					$("#content").html(html);
				});
			});
			/* Follow user */
			$(document).on("click", ".followUser", function(event) {
				var user = $(this).parent();
				$.post("Follow", {
					id : $(this).parent().attr("id")
				}, function(event) {
					$("#content").load("Followed");
					$("#rcolumn").load("NotFollowed");
				});
				event.preventDefault();
			});
			/* UnFollow user */
			$(document).on("click", ".unfollowUser", function(event) {
				var user = $(this).parent();
				$.post("Unfollow", {
					id : $(this).parent().attr("id")
				}, function(event) {
					$("#content").load("Followed");
					$("#rcolumn").load("NotFollowed");
				});
				event.preventDefault();
			});
			/* Add tweet */
			$(document).on("click", "#addTweet", function(event) {
				$.post("AddTweet", {
					content : $("#tweetContent").text()
				}, function(event) {
					$("#content").load("Timeline");
				});
				event.preventDefault();
			});
			/* Delete tweet */
			$(document).on("click", ".delTweet", function(event) {
				var tweet = $(this).parent();
				$.post("DelTweet", {
					id : $(this).parent().attr("id")
				}, function(event) {
					$("#content").load("Timeline");
				});
				event.preventDefault();
			});
			/* Ban user (admin) */
			$(document).on("click", ".banUser", function(event) {
				var userDiv = $(this).parent();
				var reason = userDiv.find(".banReason").val();
				$.post("BanUser", {
					id : userDiv.attr("id"),
					reason : reason
				}, function() {
					$("#content").load("GestioUsuaris");
				});
				event.preventDefault();
			});
			/* Unban user (admin) */
			$(document).on("click", ".unbanUser", function(event) {
				var userDiv = $(this).parent();
				$.post("UnbanUser", {
					id : userDiv.attr("id")
				}, function() {
					$("#content").load("GestioUsuaris");
				});
				event.preventDefault();
			});
			/* Like / Unlike tweet (toggle) */
			$(document).on("click", ".likeTweet", function(event) {
				var tweetDiv = $(this).parent();
				$.post("LikeTweet", {
					id : tweetDiv.attr("id")
				}, function() {
					// Reload the correct tweet list depending on which page we're on
					if ($("#feedIterator").length) {
						$("#feedIterator").load("FeedTweets");
					} else if ($("#iterator").length) {
						$("#iterator").load("Tweets");
					} else if ($("#globalFeedIterator").length) {
						$("#globalFeedIterator").load("GlobalFeedTweets");
					}
				});
				event.preventDefault();
			});
			/* Comentar / Responder Tweet (Lógica Añadida) */
			$(document).on("click", ".commentTweetBtn", function(event) {
				event.preventDefault();
				var tweetDiv = $(this).closest(".w3-card"); // Busca el contenedor del tweet
				var parentId = tweetDiv.attr("id"); // Obtiene el ID del tweet padre
				var content = tweetDiv.find(".commentText").val(); // Obtiene el texto introducido
				
				if (content.trim() !== "") {
					$.post("AddTweet", {
						content : content,
						parentId : parentId
					}, function() {
						// Recargamos el iterador de tweets dinámico en el que nos encontremos actualmente
						if ($("#feedIterator").length) {
							$("#feedIterator").load("FeedTweets");
						} else if ($("#iterator").length) {
							$("#iterator").load("Tweets");
						} else if ($("#globalFeedIterator").length) {
							$("#globalFeedIterator").load("GlobalFeedTweets");
						}
					});
				}
			});

		};

		App.stack = function () {
			$("#stack").toggleClass("w3-show");
		};

		// Ensure `App.init` runs correctly
		$(document).ready(function () {
			App.init();
		});

	</script>

</head>

<body>

	<div class="w3-theme w3-top" id="navigation"> </div>
	<div class="w3-row-padding" style="margin-top: 50px;margin-bottom: 75px">

		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="lcolumn"> </div>
		</div>
		<div class="w3-container w3-col m6">
			<div id="content"> </div>
		</div>
		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="rcolumn"> </div>
		</div>

	</div>
	<footer class="w3-container w3-theme w3-bottom">
		<p>Pompeu Fabra University @2026</p>
	</footer>

</body>

</html>
